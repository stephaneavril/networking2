<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Preguntas post login</title>
  <style>
    body { font-family: system-ui, Segoe UI, Arial; margin:24px; background:#0f172a; color:#e5e7eb; }
    .card { background:#111827; padding:24px; border-radius:14px; max-width:800px; margin:auto; }
    textarea, button { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #374151; background:#111827; color:#e5e7eb; }
    button { background:#10b981; border:none; cursor:pointer; }
    label { display:block; margin-top:12px; font-size:14px; color:#9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🧩 Cuéntanos de ti</h2>
    <form method="post">
      <label>¿Cuál es tu mayor pasión? (r2)</label>
      <textarea name="r2" rows="2"></textarea>

      <label>Dato curioso sobre ti (r3)</label>
      <textarea name="r3" rows="2"></textarea>

      <label>Película favorita (r4)</label>
      <textarea name="r4" rows="2"></textarea>

      <label>Deporte favorito (r6)</label>
      <textarea name="r6" rows="2"></textarea>

      <label>Prenda imprescindible (r8)</label>
      <textarea name="r8" rows="2"></textarea>

      <label>Mejor concierto (r9)</label>
      <textarea name="r9" rows="2"></textarea>

      <label>Libro/obra de arte favorita (r10)</label>
      <textarea name="r10" rows="2"></textarea>

      <label>¿Tienes mascota? (r12)</label>
      <textarea name="r12" rows="2"></textarea>

      <label>¿Tienes hijos? (r13)</label>
      <textarea name="r13" rows="2"></textarea>

      <br><br>
      <button>Guardar y jugar</button>
    </form>
  </div>
</body>
</html>
