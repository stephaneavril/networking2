<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🏆 Ranking – Adivina Quién</title>
  <style>
    body{
      background:#0c0e2c;
      font-family:'Segoe UI',sans-serif;
      color:#fff;
      text-align:center;
      padding:30px;
    }
    table{
      margin:0 auto;
      width:90%;
      border-collapse:collapse;
      box-shadow:0 0 15px rgba(0,0,0,.4);
      border-radius:12px;
      overflow:hidden;
    }
    th,td{padding:12px}
    th{
      background:#ec1c24;
      color:#fff;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-weight:600;
    }
    tbody tr{background:#121437}
    tbody tr:nth-child(even){background:#14163a}
    tr.highlight{
      background:#1f214a !important;
      font-weight:700;
      outline:2px solid rgba(255,255,255,.08);
    }
    a{color:#ec1c24;text-decoration:none}
  </style>
</head>
<body>
  <h1>🏆 Ranking – Adivina Quién</h1>

  <table>
    <thead>
      <tr>
        <th>Posición</th>
        <th>Nombre</th>
        <th>Aciertos</th>
        <th>Bonus</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
    {% for r in resultados %}
      <tr {% if mi_resultado and r['nombre_jugador'] == mi_resultado['nombre_jugador'] %}class="highlight"{% endif %}>
        <td>{{ loop.index }}</td>
        <td>{{ r['nombre_jugador'] }}</td>
        <td>{{ r['aciertos'] }}</td>
        <td>{{ r['puntos_extra'] }}</td>
        <td>{{ r['total'] }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5">Sin puntajes todavía.</td></tr>
    {% endfor %}
    </tbody>
  </table>

  <p style="margin-top:25px">
    <a href="{{ url_for('index_page') }}">🏠 Volver al inicio</a>
  </p>
</body>
</html>
