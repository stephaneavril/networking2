<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Subir Foto — Conexión Alfa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Segoe UI,system-ui;background:#0f1115;color:#e8e8e8;margin:0}
    .wrap{max-width:720px;margin:40px auto;padding:24px}
    .card{background:#141821;border:1px solid #233048;border-radius:16px;padding:18px}
    .actions{display:flex;gap:12px;margin-top:14px}
    .btn{background:#3b82f6;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;display:inline-block;border:none;cursor:pointer}
    .btn.secondary{background:#2a3346}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📷 Subir Foto con tu Match</h1>
    <div class="card">
      <p>Personas: <strong>{{ match.nombre_1 }}</strong> y <strong>{{ match.nombre_2 }}</strong></p>
      <form method="post" enctype="multipart/form-data">
        <input type="file" name="foto" accept="image/*" />
        <div class="actions">
          <button class="btn" type="submit">Subir</button>
          <a class="btn secondary" href="{{ url_for('conexion_alfa_mi_match') }}">Volver</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
