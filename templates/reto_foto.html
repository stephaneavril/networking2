<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reto Foto — Subir</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;background:#0b0b0f;color:#eaeaf2;margin:0;padding:24px}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:#13131a;border:1px solid #242433;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .btn{appearance:none;border:1px solid #3a3a4d;background:#1e1e2a;color:#fff;padding:12px 16px;border-radius:12px;text-decoration:none;display:inline-block;cursor:pointer}
    .btn:hover{background:#2a2a3a}
    .btn.primary{background:#3a6df0;border-color:#3a6df0}
    .btn.primary:hover{background:#2f59c6}
    .muted{color:#a9a9ba}
    input[type=file]{background:#0f0f16;border:1px solid #2a2a3a;color:#e8e8f5;padding:10px;border-radius:12px;width:100%;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📸 Reto Foto</h1>
    <p class="muted">Reto activo: <b>{{ reto.titulo }}</b></p>
    {% if reto.descripcion %}<p class="muted">{{ reto.descripcion }}</p>{% endif %}
    <form method="post" action="{{ url_for('reto_foto_subir') }}" enctype="multipart/form-data">
      <p><input type="file" name="foto" accept=".jpg,.jpeg,.png,.gif" required></p>
      <div class="row">
        <button class="btn primary" type="submit">Subir foto</button>
        <a class="btn" href="{{ url_for('index_page') }}">Volver al inicio</a>
        <a class="btn" href="{{ url_for('reto_foto_galeria') }}">Ir a la galería</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
