<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mi Perfil — Conexión Alfa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Segoe UI,system-ui;background:#0f1115;color:#e8e8e8;margin:0}
    .wrap{max-width:820px;margin:40px auto;padding:24px}
    .card{background:#141821;border:1px solid #233048;border-radius:16px;padding:18px}
    pre{white-space:pre-wrap;word-wrap:break-word;margin:0}
    .actions{display:flex;gap:12px;margin-top:14px}
    .btn{background:#3b82f6;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;display:inline-block}
    .btn.secondary{background:#2a3346}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧑‍🎤 Mi Perfil</h1>
    <div class="card">
      <pre>{{ perfil.perfil_ia }}</pre>
    </div>
    <div class="actions">
      <a class="btn" href="{{ url_for('conexion_alfa_mi_match') }}">Ver mi match</a>
      <a class="btn secondary" href="{{ url_for('conexion_alfa_form') }}">Editar respuestas</a>
      <a class="btn secondary" href="{{ url_for('index_page') }}">Inicio</a>
    </div>
  </div>
</body>
</html>
