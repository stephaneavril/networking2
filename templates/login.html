<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;background:#0b0b0f;color:#eaeaf2;margin:0;display:grid;place-items:center;min-height:100vh}
  .card{width:min(480px, 92vw); background:#13131a;border:1px solid #242433;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  label{display:block;font-size:1rem;margin:10px 0 6px;color:#cbd5e1}
  input{width:100%;font-size:1rem;padding:14px 16px;border-radius:12px;border:1px solid #3a3a4d;background:#1e1e2a;color:#fff;outline:none}
  input:focus{border-color:#3a6df0}
  button{width:100%;margin-top:14px;padding:14px 16px;border-radius:12px;background:#3a6df0;border:1px solid #3a6df0;color:#fff;cursor:pointer}
  button:hover{background:#2f59c6}
</style>

</head>
<body>
  <div class="card">
    <h2>👋 Bienvenido</h2>
    <form method="post">
      <label>Nombre</label>
      <input name="nombre" placeholder="Tu nombre" required>
      <br><br>
      <label>Correo</label>
      <input name="correo" type="email" placeholder="tucorreo@dominio.com" required>
      <br><br>
      <button>Entrar</button>
    </form>
  </div>
</body>
</html>
