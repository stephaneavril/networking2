<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <style>
    body { font-family: system-ui, Segoe UI, Arial; display:grid; place-items:center; height:100vh; margin:0; background:#0f172a; color:#e5e7eb;}
    .card { background:#111827; padding:24px; border-radius:14px; width:320px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    input,button { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #374151; background:#111827; color:#e5e7eb; }
    button { background:#2563eb; border:none; cursor:pointer; }
    label { font-size:14px; color:#9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <h2>👋 Bienvenido</h2>
    <form method="post">
      <label>Nombre</label>
      <input name="nombre" placeholder="Tu nombre" required>
      <br><br>
      <label>Correo</label>
      <input name="correo" type="email" placeholder="tucorreo@dominio.com" required>
      <br><br>
      <button>Entrar</button>
    </form>
  </div>
</body>
</html>
