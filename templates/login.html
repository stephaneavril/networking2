<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login</title>
<style>
  :root{--bg:#0b0b0f;--card:#13131a;--stroke:#242433;--btn:#3a6df0}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:#eaeaf2;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
    display:grid;place-items:center;
  }
  .card{
    width:min(560px, 94vw); /* ancho cómodo en móvil */
    background:var(--card);border:1px solid var(--stroke);
    border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.35)
  }
  h2{margin:0 0 18px 0;font-size:clamp(20px, 4.5vw, 26px)}
  label{display:block;margin:12px 0 6px;color:#cbd5e1;font-size:16px}
  input{
    width:100%;font-size:18px; /* texto grande */
    padding:16px 14px;border-radius:12px;
    border:1px solid #3a3a4d;background:#1e1e2a;color:#fff;outline:none
  }
  input:focus{border-color:var(--btn)}
  button{
    width:100%;margin-top:14px;padding:16px; /* botón grande */
    font-size:18px;border-radius:12px;background:var(--btn);
    border:1px solid var(--btn);color:#fff;cursor:pointer
  }
  button:hover{filter:brightness(.95)}
  .hint{opacity:.7;font-size:14px;margin-top:8px}
</style>

</head>
<body>
  <div class="card">
    <h2>👋 Bienvenido</h2>
    <form method="post">
      <label>Nombre</label>
      <input name="nombre" placeholder="Tu nombre" required>
      <br><br>
      <label>Correo</label>
      <input name="correo" type="email" placeholder="tucorreo@dominio.com" required>
      <br><br>
      <button>Entrar</button>
    </form>
  </div>
</body>
</html>
