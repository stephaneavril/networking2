<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Adivina Quién</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;background:#0b0b0f;color:#eaeaf2;margin:0;padding:24px}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:#13131a;border:1px solid #242433;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-block;border:1px solid #2a2a3a;background:#161622;color:#cbd5e1;border-radius:999px;padding:6px 10px;font-size:.95rem}
    .btn{appearance:none;border:1px solid #3a3a4d;background:#1e1e2a;color:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;cursor:pointer}
    .btn.primary{background:#3a6df0;border-color:#3a6df0}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .hint{background:#0f1729;border:1px solid #253057;border-radius:10px;padding:10px}
    .bad{color:#f87171}.ok{color:#4ade80}.muted{color:#a9a9ba}
    .shake{animation:shake .3s linear}
    @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <h1 style="margin:.2rem 0">Adivina Quién</h1>
        <div class="muted">Hola, {{ yo }}. Adivina la persona con base en 3 pistas.</div>
      </div>
      <div class="row">
        <span class="pill" id="round">Ronda 0/<span id="total">0</span></span>
        <span class="pill">✅ <span id="ok">0</span></span>
        <span class="pill">❌ <span id="ko">0</span></span>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid #242433;margin:16px 0">
    <div id="game"></div>
    <hr style="border:none;border-top:1px solid #242433;margin:16px 0">
    <div class="muted">La partida termina automáticamente al completar todas las rondas.</div>
  </div>
</div>

<script>
  const participantes = JSON.parse({{ participantes_json|tojson|safe }});

  // Si por alguna razón el servidor nos devuelve 0 (no debería, hay guardas), mostramos mensaje.
  if (!Array.isArray(participantes) || participantes.length === 0){
    document.getElementById('game').innerHTML =
      '<p class="muted">Aún no hay suficientes participantes para jugar. Vuelve más tarde.</p>';
  }

  // Estado
  let idx = 0;
  let aciertos = 0;
  let fallos = 0;
  let rondas = 0;
  const TOTAL = participantes.length;  // hasta 10, sin incluirte a ti
  document.getElementById('total').textContent = TOTAL;

  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  function opcionesPara(iObjetivo){
    const correct = participantes[iObjetivo];
    const pool = participantes.filter((_,i)=>i!==iObjetivo).map(p=>({id:p.id,nombre:p.nombre}));
    shuffle(pool);
    const distractores = pool.slice(0, Math.min(4, pool.length));
    const opts = [{id:correct.id, nombre:correct.nombre}, ...distractores];
    return shuffle(opts);
  }

  function renderRound(){
    if (idx >= TOTAL){
      return finalizar();
    }
    const p = participantes[idx];
    const cont = document.getElementById('game');
    const opts = opcionesPara(idx);

    cont.innerHTML = `
      <div id="roundcard">
        <div class="row" style="margin-bottom:10px;gap:8px">
          ${(p.pistas||[]).map(h=>`<div class="hint">${h.label}: <b>${h.text}</b></div>`).join("")}
        </div>
        <label class="muted" for="sel">¿Quién crees que es?</label><br>
        <select id="sel" style="margin-top:8px;padding:10px;border-radius:10px;background:#0f0f16;color:#fff;border:1px solid #2a2a3a;min-width:260px">
          <option value="">— Selecciona —</option>
          ${opts.map(o=>`<option value="${o.id}">${o.nombre}</option>`).join("")}
        </select>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="btn-ok" disabled>Validar</button>
        </div>
        <div id="msg" class="muted" style="margin-top:10px"></div>
      </div>
    `;

    const sel = document.getElementById('sel');
    const btn = document.getElementById('btn-ok');
    sel.addEventListener('change', ()=> btn.disabled = !sel.value);

    btn.addEventListener('click', ()=>{
      if (!sel.value) return;
      const chosen = parseInt(sel.value,10);
      const isRight = chosen === p.id;
      const msg = document.getElementById('msg');
      const card = document.getElementById('roundcard');

      rondas++;
      if (isRight){
        aciertos++;
        msg.innerHTML = `<span class="ok">✅ ¡Correcto!</span>`;
      }else{
        fallos++;
        msg.innerHTML = `<span class="bad">❌ Incorrecto.</span>`;
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      }

      document.getElementById('ok').textContent = aciertos;
      document.getElementById('ko').textContent = fallos;
      document.getElementById('round').innerHTML = `Ronda ${rondas}/<span id="total">${TOTAL}</span>`;

      idx++;
      setTimeout(renderRound, 350);
    });

    document.getElementById('round').innerHTML = `Ronda ${rondas}/<span id="total">${TOTAL}</span>`;
    document.getElementById('ok').textContent = aciertos;
    document.getElementById('ko').textContent = fallos;
  }

  async function finalizar(){
    const payload = {aciertos, fallos, rondas};
    let resumen = `
      <h2>Resultados</h2>
      <p>✅ Aciertos: <b>${aciertos}</b> &nbsp; ❌ Fallos: <b>${fallos}</b> &nbsp; 🔄 Rondas: <b>${rondas}</b> de <b>${TOTAL}</b></p>
    `;
    try{
      const resp = await fetch('{{ url_for("adivina_finalizado") }}', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const data = await resp.json();
      resumen += `<p>Puntos base: <b>${data.puntos_base}</b> &nbsp; Bonus: <b>${data.puntos_bonus}</b> &nbsp; Total: <b>${data.puntos_total}</b></p>`;
    }catch(e){
      resumen += `<p class="bad">No pude registrar el puntaje, pero tu partida terminó.</p>`;
    }

    // Ranking (si el endpoint existe)
    let tabla = '';
    try{
      const r = await fetch('{{ url_for("adivina_scores_top") if "adivina_scores_top" in globals() else "#" }}');
      if (r.ok){
        const top = await r.json();
        if (Array.isArray(top) && top.length){
          tabla = `<h3>Top 10</h3>
          <ol>${top.map(x=>`<li>${x.nombre} — ${x.puntos_total} pts (✅${x.aciertos}/❌${x.fallos})</li>`).join("")}</ol>`;
        }
      }
    }catch(_){}

    document.getElementById('game').innerHTML = `
      ${resumen}
      ${tabla}
      <div class="row" style="margin-top:10px">
        <a class="btn" href="{{ url_for('index_page') }}">Volver al inicio</a>
      </div>
    `;
  }

  renderRound();
</script>
</body>
</html>
