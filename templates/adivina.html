<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Adivina Quién</title>
  <style>
    body { font-family: system-ui, Segoe UI, Arial; margin:24px; background:#0f172a; color:#e5e7eb; }
    .wrap { max-width:800px; margin:auto; }
    .card { background:#111827; padding:24px; border-radius:14px; }
    select, button { padding:10px 12px; border-radius:10px; border:1px solid #374151; background:#111827; color:#e5e7eb; }
    button { background:#6366f1; border:none; cursor:pointer; }
    .muted { color:#9ca3af; font-size:14px; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>🕵️ Adivina Quién</h2>
  <p class="muted">Hola <b>{{ yo }}</b>. Te mostraremos una pista de alguien; elige a quién crees que pertenece. ¡Suerte!</p>

  <div class="card" id="game">
    <p id="pista">Cargando pista…</p>
    <label>¿De quién es esta pista?</label>
    <br><br>
    <select id="selector"></select>
    <br><br>
    <button id="btn">Confirmar</button>
    <p class="muted" id="estado"></p>
  </div>

  <p style="margin-top:16px"><a href="/logout" style="color:#93c5fd">Cerrar sesión</a></p>
</div>

<script>
const participantes = {{ participantes_json|safe }};
const nombres = participantes.map(p => p.nombre);
const selector = document.getElementById('selector');
const pistaEl = document.getElementById('pista');
const estado = document.getElementById('estado');
const btn = document.getElementById('btn');

let ronda = 0, aciertos = 0, actual = null;
const RONDAS_MAX = Math.min(10, participantes.length); // hasta 10 o menos si hay pocos

function nuevaRonda() {
  if (ronda >= RONDAS_MAX || participantes.length === 0) return finalizar();
  estado.textContent = '';
  ronda++;

  // elige una persona al azar con al menos 1 pista
  let cand = participantes.filter(p => p.pistas && p.pistas.length > 0);
  if (cand.length === 0) { finalizar(); return; }
  actual = cand[Math.floor(Math.random() * cand.length)];

  // elige 1 pista al azar
  const pista = actual.pistas[Math.floor(Math.random() * actual.pistas.length)];
  pistaEl.textContent = `Pista ${ronda}/${RONDAS_MAX}: ${pista}`;

  // llena opciones (nombres mezclados)
  const opciones = [...nombres];
  opciones.sort(() => Math.random() - 0.5);

  selector.innerHTML = '';
  opciones.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    selector.appendChild(opt);
  });
}

btn.addEventListener('click', () => {
  if (!actual) return;
  const elegido = selector.value;
  const ok = (elegido === actual.nombre);
  if (ok) aciertos++;
  estado.textContent = ok ? '✅ ¡Correcto!' : `❌ Era: ${actual.nombre}`;
  setTimeout(nuevaRonda, 800);
});

function finalizar() {
  btn.disabled = true;
  pistaEl.textContent = `🎉 Juego terminado. Aciertos: ${aciertos} / ${RONDAS_MAX}`;
  estado.textContent = 'Guardando resultado...';
  fetch('/adivina_finalizado', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ aciertos, rondas: RONDAS_MAX })
  }).then(()=> estado.textContent = 'Resultado guardado.')
    .catch(()=> estado.textContent = 'No se pudo guardar (pero terminaste el juego).');
}

nuevaRonda();
</script>
</body>
</html>
