<!-- templates/adivina.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Adivina Quién</title>
  <style>
    :root{--bg:#0b0b0f;--card:#13131a;--edge:#242433;--muted:#a9a9ba;--pill:#161622;--btn:#1e1e2a;--brand:#3a6df0}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;background:var(--bg);color:#eaeaf2;margin:0;padding:24px}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-block;border:1px solid #2a2a3a;background:var(--pill);color:#cbd5e1;border-radius:999px;padding:6px 10px;font-size:.95rem}
    .muted{color:var(--muted)}
    .hint{background:#0f1729;border:1px solid #253057;border-radius:10px;padding:10px}
    .btn{appearance:none;border:1px solid #3a3a4d;background:var(--btn);color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer}
    .btn.primary{background:var(--brand);border-color:var(--brand)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .opt{padding:12px;border-radius:12px;border:1px solid #3a3a4d;background:#1e1e2a;color:#fff;cursor:pointer;text-align:left}
    .opt[disabled]{opacity:.6;cursor:not-allowed}
    .shake{animation:shake .3s linear}
    @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
    .bar{height:8px;background:#222;border-radius:6px;overflow:hidden}
    .bar>span{display:block;height:100%;background:var(--brand);width:0}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <h1 style="margin:.2rem 0">Adivina Quién</h1>
        <div class="muted">Hola, {{ yo }}. Adivina la persona con base en 3 pistas.</div>
      </div>
      <div class="row">
        <span class="pill" id="round">Ronda 0/5</span>
        <span class="pill">✅ <span id="ok">0</span></span>
        <span class="pill">❌ <span id="ko">0</span></span>
      </div>
    </div>

    <div class="bar" style="margin:14px 0 6px"><span id="barfill"></span></div>
    <hr style="border:none;border-top:1px solid var(--edge);margin:12px 0 16px">

    <div id="game"></div>

    <hr style="border:none;border-top:1px solid var(--edge);margin:16px 0 0">
    <div class="muted" id="footmsg" style="margin-top:8px">La partida termina automáticamente.</div>
  </div>
</div>

<script>
(() => {
  // ==== Config ====
  const RONDAS_MAX = 5;

  // ==== Datos del backend ====
  const PARTICIPANTES = JSON.parse('{{ participantes_json|tojson|safe }}') || [];

  // Si hay menos gente que RONDAS_MAX, jugamos con los que haya.
  const pool = PARTICIPANTES.slice(0, Math.min(RONDAS_MAX, PARTICIPANTES.length));

  // ==== Estado ====
  let idx = 0;
  let aciertos = 0;
  let fallos = 0;
  let rondas = 0;
  let finished = false;

  // ==== Helpers UI ====
  const $ = sel => document.querySelector(sel);
  const game = $('#game');
  const okEl = $('#ok'), koEl = $('#ko'), roundEl = $('#round'), barfill = $('#barfill');

  function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
  function esc(s){ return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;'); }

  function headerUpdate(){
    roundEl.textContent = `Ronda ${Math.min(rondas+1, RONDAS_MAX)}/${RONDAS_MAX}`;
    okEl.textContent = aciertos;
    koEl.textContent = fallos;
    barfill.style.width = `${(rondas / RONDAS_MAX) * 100}%`;
  }

  function opciones(part){
    // 4 opciones máximo, incluyendo la correcta
    const others = pool.filter(p => p.id !== part.id).map(p => ({id:p.id, nombre:p.nombre}));
    const distract = shuffle(others).slice(0, Math.min(3, others.length));
    const opts = shuffle([{id: part.id, nombre: part.nombre}, ...distract]);
    return opts;
  }

  function renderRound(){
    if (finished) return;

    if (rondas >= RONDAS_MAX || idx >= pool.length){
      finalizar();
      return;
    }

    const p = pool[idx];
    const pistas = (p.pistas||[]).slice(0,3).map(h => `<div class="hint">${esc(h.label)}: <b>${esc(h.text)}</b></div>`).join("") || '<div class="muted">Sin pistas</div>';
    const opts = opciones(p).map(o => `
      <button class="opt" data-id="${o.id}">${esc(o.nombre)}</button>
    `).join("");

    game.innerHTML = `
      <div id="roundcard">
        <div class="row" style="margin-bottom:10px;gap:8px">${pistas}</div>
        <div class="row" id="opts" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">${opts}</div>
        <div id="msg" class="muted" style="margin-top:10px;min-height:24px"></div>
      </div>
    `;
    headerUpdate();

    $('#opts').addEventListener('click', onPick);
  }

  function disableOptions(){
    document.querySelectorAll('.opt').forEach(b => b.disabled = true);
    const opts = $('#opts');
    if (opts) opts.style.pointerEvents = 'none';
  }

  function onPick(e){
    const btn = e.target.closest('.opt');
    if (!btn || finished) return;

    disableOptions();

    const elegido = Number(btn.dataset.id);
    const correcto = pool[idx].id;
    const msg = $('#msg');
    const card = $('#roundcard');

    if (elegido === correcto){
      aciertos++;
      msg.innerHTML = '✅ ¡Correcto!';
    }else{
      fallos++;
      msg.innerHTML = '❌ Incorrecto.';
      // animación leve para feedback
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }

    rondas++;
    idx++;
    headerUpdate();

    setTimeout(() => {
      if (rondas >= RONDAS_MAX || idx >= pool.length) {
        finalizar();
      } else {
        renderRound();
      }
    }, 600);
  }

  async function finalizar(){
    if (finished) return;
    finished = true;

    $('#footmsg').textContent = 'Guardando puntaje…';
    try{
      const resp = await fetch('{{ url_for("adivina_finalizado") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ aciertos, fallos, rondas })
      });
      const data = await resp.json();
      game.innerHTML = `
        <div style="background:#101018;border:1px solid #2a2a3a;border-radius:16px;padding:22px">
          <h2 style="margin-top:0">🏁 ¡Partida terminada!</h2>
          <p>Rondas: <b>${rondas}</b> &middot; Aciertos: <b>${aciertos}</b> &middot; Fallos: <b>${fallos}</b></p>
          <ul style="margin-left:18px">
            <li>Puntos base: <b>${data.puntos_base}</b></li>
            <li>Bonus: <b>${data.puntos_bonus}</b></li>
            <li>Total: <b>${data.puntos_total}</b></li>
          </ul>
          <div class="row" style="margin-top:10px">
            <a class="btn" href="{{ url_for('index_page') }}">Volver al inicio</a>
          </div>
        </div>
      `;
      $('#footmsg').textContent = 'Resultado guardado.';
      barfill.style.width = '100%';
      roundEl.textContent = `Ronda ${RONDAS_MAX}/${RONDAS_MAX}`;
    }catch(err){
      game.innerHTML = `
        <div style="background:#3a1e1e;border:1px solid #7a1f2b;color:#fff;padding:16px;border-radius:12px">
          Ocurrió un error al guardar el puntaje. Puedes recargar o volver al inicio.
          <div class="row" style="margin-top:10px">
            <a class="btn" href="{{ url_for('index_page') }}">Volver</a>
          </div>
        </div>`;
      $('#footmsg').textContent = 'Error al guardar.';
    }
  }

  // Inicio
  if (pool.length === 0){
    game.innerHTML = `
      <div class="muted">No hay suficientes participantes para jugar. Vuelve más tarde.</div>
    `;
    $('#footmsg').textContent = '';
  }else{
    renderRound();
  }
})();
</script>
</body>
</html>
